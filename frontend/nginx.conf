server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Docker embedded DNS. ipv6=off is required: without it AAAA lookups
    # return SERVFAIL and proxying fails at request time.
    resolver 127.0.0.11 valid=30s ipv6=off;

    client_max_body_size 5m;

    # Embedded apps are framed by the Shopify admin; never send X-Frame-Options.
    add_header X-Content-Type-Options "nosniff" always;

    # Scanners probe for /application/.env and friends. The SPA fallback below
    # would answer those with 200 + index.html; 404 is the honest answer.
    location ~ /\. {
        access_log off;
        return 404;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    # Anything the backend owns: API, OAuth, webhooks, health.
    location ~ ^/(api|auth|webhooks|healthz)(/|$) {
        # Variable + resolver so the upstream name is resolved per request,
        # not at config load time (backend may not be up yet at startup).
        set $backend_upstream http://backend:3001;
        proxy_pass $backend_upstream$request_uri;

        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "";
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
