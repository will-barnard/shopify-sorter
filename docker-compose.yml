services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: sorter
      POSTGRES_USER: sorter
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sorter -d sorter"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "5432"
    networks:
      - internal

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: "3001"
      DATABASE_URL: postgres://sorter:${DB_PASSWORD}@postgres:5432/sorter
      SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
      SHOPIFY_API_SECRET: ${SHOPIFY_API_SECRET}
      SHOPIFY_API_VERSION: ${SHOPIFY_API_VERSION:-2026-07}
      SHOPIFY_SCOPES: ${SHOPIFY_SCOPES:-read_products,write_products}
      APP_URL: ${APP_URL}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
    expose:
      - "3001"
    networks:
      - internal

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_SHOPIFY_API_KEY: ${SHOPIFY_API_KEY}
    restart: unless-stopped
    depends_on:
      - backend
    expose:
      - "80"
    networks:
      - internal

volumes:
  pgdata:
    name: shopify-sorter-postgres

networks:
  internal:
